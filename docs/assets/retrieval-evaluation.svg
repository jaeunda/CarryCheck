<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title description">
  <title id="title">Retrieval evaluation on ten presentation questions</title>
  <desc id="description">Grouped bar chart. Recall at 3 is 1.00 for Dense, BM25, and Hybrid. MRR is 0.80 for Dense, 0.95 for BM25, and 0.933 for Hybrid.</desc>
  <rect width="920" height="480" rx="18" fill="#fbfaf6"/>
  <text x="64" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18332f">Retrieval evaluation (n=10)</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#5f6f6c">
    <line x1="90" y1="380" x2="860" y2="380" stroke="#a8b4b1"/>
    <line x1="90" y1="310" x2="860" y2="310" stroke="#dbe1df"/>
    <line x1="90" y1="240" x2="860" y2="240" stroke="#dbe1df"/>
    <line x1="90" y1="170" x2="860" y2="170" stroke="#dbe1df"/>
    <line x1="90" y1="100" x2="860" y2="100" stroke="#dbe1df"/>
    <text x="52" y="385">0.00</text>
    <text x="52" y="315">0.25</text>
    <text x="52" y="245">0.50</text>
    <text x="52" y="175">0.75</text>
    <text x="52" y="105">1.00</text>
  </g>
  <g>
    <rect x="160" y="100" width="72" height="280" rx="6" fill="#087f6d"/>
    <rect x="242" y="156" width="72" height="224" rx="6" fill="#e6a23c"/>
    <rect x="406" y="100" width="72" height="280" rx="6" fill="#087f6d"/>
    <rect x="488" y="114" width="72" height="266" rx="6" fill="#e6a23c"/>
    <rect x="652" y="100" width="72" height="280" rx="6" fill="#087f6d"/>
    <rect x="734" y="119" width="72" height="261" rx="6" fill="#e6a23c"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#18332f">
    <text x="196" y="90">1.00</text>
    <text x="278" y="146">0.80</text>
    <text x="442" y="90">1.00</text>
    <text x="524" y="104">0.95</text>
    <text x="688" y="90">1.00</text>
    <text x="770" y="109">0.933</text>
    <text x="237" y="414">Dense</text>
    <text x="483" y="414">BM25</text>
    <text x="729" y="414">Hybrid</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334b47">
    <rect x="610" y="38" width="18" height="18" rx="3" fill="#087f6d"/>
    <text x="636" y="52">Recall@3</text>
    <rect x="728" y="38" width="18" height="18" rx="3" fill="#e6a23c"/>
    <text x="754" y="52">MRR</text>
  </g>
</svg>
