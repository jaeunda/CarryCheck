[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-baggage-agent"
version = "0.1.0"
description = "Deterministic airline baggage and country-entry policy assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.117.1,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
carrycheck = "airline_baggage_agent.run_local_web:main"
carrycheck-api = "airline_baggage_agent.run_api_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airline_baggage_agent = ["data/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
